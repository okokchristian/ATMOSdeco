<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago no procesado — ATMOS deco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/categorias.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="bg-fixed"></div>

    <section class="estado-pago">
        <div class="estado-pago-content">
            <div class="estado-icono estado-icono-error">
                <i class="bi bi-x-lg"></i>
            </div>
                        <h1>No pudimos procesar tu pago</h1>
            <p>Mercado Pago no aprobó el pago y <strong>no se realizó ningún cobro</strong>. Podés intentar de nuevo con otro medio de pago, o escribirnos por WhatsApp y te ayudamos a completar tu compra (también aceptamos transferencia bancaria).</p>
            <div class="estado-pago-botones">
                <a href="https://wa.me/59892980915?text=Hola!%20Tuve%20un%20problema%20con%20un%20pago%20por%20Mercado%20Pago" target="_blank" class="btn-comprar btn-whatsapp" id="btn-whatsapp-pedido">
                    <i class="bi bi-whatsapp"></i> Pedir ayuda por WhatsApp
                </a>
                <a href="html/lamparas.html" class="btn-verproductos-outline" id="btn-reintentar">Volver a intentar</a>
            </div>
        </div>
    </section>

    <script>
    try {
        const params = new URLSearchParams(window.location.search);
        const idPago = params.get('payment_id');
        const pedido = JSON.parse(localStorage.getItem('atmosPedido'));
        const reciente = pedido && Date.now() - pedido.fecha < 24 * 60 * 60 * 1000;

        // "Volver a intentar" lleva a la lámpara que estaba comprando
        if (reciente && pedido.id) {
            document.getElementById('btn-reintentar').href =
                `html/productos.html?id=${encodeURIComponent(pedido.id)}`;
        }

        let mensaje = '¡Hola! Intenté pagar por Mercado Pago pero el pago fue rechazado. ¿Me ayudan a completar la compra?';

        if (reciente) {
            mensaje +=
                `\n• ${pedido.producto}` +
                `\n• Color: ${pedido.color}` +
                `\n• Entrega: ${pedido.entrega}` +
                `\n• Total: ${pedido.precio}`;
        }

        if (idPago) {
            mensaje += `\n• N.º de operación: ${idPago}`;
        }

        document.getElementById('btn-whatsapp-pedido').href =
            `https://wa.me/59892980915?text=${encodeURIComponent(mensaje)}`;
    } catch (err) {
        // si algo falla, quedan los links genéricos
    }
</script>

</body>
</html>
