<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMOS deco — Ya volvemos</title>
<style>
  :root {
    --bg: #0b0b10;
    --red: #c23b2e;
    --blue: #2f3fb0;
    --cream: #f2ede4;
    --muted: #9a97a3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .waves {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.55;
  }

  .waves svg {
    width: 100%;
    height: 100%;
  }

  .content {
    position: relative;
    z-index: 1;
    max-width: 640px;
    text-align: center;
    padding: 2rem;
  }

  .wordmark {
    font-size: 1.05rem;
    letter-spacing: 0.14em;
    font-weight: 700;
    color: var(--cream);
    margin-bottom: 3.5rem;
  }

  .wordmark span {
    display: block;
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-size: 0.95rem;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.15;
    font-weight: 600;
    margin-bottom: 1.4rem;
  }

  p.lead {
    font-size: 1.05rem;
    color: var(--muted);
    line-height: 1.6;
    max-width: 420px;
    margin: 0 auto 2.5rem;
  }

  .contact {
    display: flex;
    gap: 1.75rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .contact a {
    color: var(--cream);
    text-decoration: none;
    font-size: 0.95rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s ease;
  }

  .contact a:hover {
    border-color: var(--cream);
  }

  @media (max-width: 480px) {
    .contact { gap: 1.25rem; }
  }
</style>
</head>
<body>

  <div class="waves">
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c23b2e"/>
          <stop offset="100%" stop-color="#0b0b10"/>
        </linearGradient>
        <linearGradient id="blueGrad" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#2f3fb0"/>
          <stop offset="100%" stop-color="#0b0b10"/>
        </linearGradient>
      </defs>
      <path d="M0,0 C 250,150 250,750 0,900 L0,0 Z" fill="url(#redGrad)"/>
      <path d="M1600,0 C 1350,150 1350,750 1600,900 L1600,0 Z" fill="url(#blueGrad)"/>
    </svg>
  </div>

  <div class="content">
    <div class="wordmark">ATMOS<span>deco</span></div>
    <h1>Estamos dándole forma a algo nuevo.</h1>
    <p class="lead">
      Estamos trabajando en nuestra web y colección. Falta poco para que puedas conocer nuestras piezas
      de iluminación en bioplástico sustentable.
    </p>
    <div class="contact">
      <a href="https://instagram.com/atmosdecouy" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:atmosdecouy@gmail.com">Escribinos</a>
    </div>
  </div>

</body>
</html>
