<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
<title>ATMOS deco — Ya volvemos</title>
<style>
  :root {
    --cream: #eee7e7e0;
    --muted: rgba(238, 231, 231, 0.7);
    --dorado: #cf9a5c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    color: var(--cream);
    font-family: 'Lato', Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Foto de fondo muy desenfocada */
  .bg {
    position: fixed;
    inset: -60px; /* se agranda para que el blur no deje bordes claros */
    z-index: 0;
    background-image: url('img/hero2.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    filter: blur(40px) saturate(110%);
  }

  /* Degradado oscuro encima, sin blur */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.6));
  }

  .content {
    position: relative;
    z-index: 1;
    max-width: 640px;
    text-align: center;
    padding: 2rem;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
  }

  .wordmark {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 3.5rem;
  }

  .wordmark span {
    display: block;
    font-size: 1rem;
    font-weight: 300;
    opacity: 0.75;
    margin-top: 0.2rem;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 1.15;
    font-weight: 600;
    margin-bottom: 1.4rem;
  }

  h1::after {
    content: "";
    display: block;
    width: 60px;
    height: 2px;
    background: var(--dorado);
    margin: 1.5rem auto 0;
  }

  p.lead {
    font-size: 1.1rem;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.6;
    max-width: 440px;
    margin: 0 auto 2.5rem;
  }

  .contact {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .contact a {
    color: var(--cream);
    text-decoration: none;
    font-size: 0.95rem;
    padding: 0.7rem 1.4rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    transition: border-color 0.3s, color 0.3s, background 0.3s;
  }

  .contact a:hover {
    border-color: var(--dorado);
    color: var(--dorado);
    background: rgba(255, 255, 255, 0.09);
  }

  @media (max-width: 480px) {
    .content { padding: 1.5rem; }
    .contact { gap: 0.75rem; }
  }
</style>
</head>
<body>

  <div class="bg"></div>

  <div class="content">
    <div class="wordmark">ATMOS<span>D E C O</span></div>
    <h1>Estamos dándole forma a algo nuevo.</h1>
    <p class="lead">
      Estamos trabajando en nuestra web y colección. Falta poco para que puedas conocer nuestras piezas
      de iluminación hechas con bioplástico sustentable.
    </p>
    <div class="contact">
      <a href="https://instagram.com/atmosdecouy" target="_blank" rel="noopener">Instagram</a>
      <a href="mailto:atmosdecouy@gmail.com">Escribinos</a>
    </div>
  </div>

</body>
</html>
