<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu compra! — ATMOS deco</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/categorias.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="bg-fixed"></div>
    <section class="estado-pago">
        <div class="estado-pago-content">
            <div class="estado-icono estado-icono-exito">
                <i class="bi bi-check-lg"></i>
            </div>
            <h1>¡Pago aprobado!</h1>
            <p><strong>Último paso: enviános tu pedido por WhatsApp para confirmar el color y coordinar la entrega o el retiro.</strong></p>
            <div class="estado-pago-botones">
                <a href="https://wa.me/59892980915?text=Hola!%20Acabo%20de%20realizar%20una%20compra%20por%20Mercado%20Pago" target="_blank" class="btn-comprar btn-whatsapp" id="btn-whatsapp-pedido">
                    <i class="bi bi-whatsapp"></i> Enviar mi pedido por WhatsApp
                </a>
            </div>
        </div>
    </section>

    <script>
    try {
        const pedido = JSON.parse(localStorage.getItem('atmosPedido'));

        // Solo si el pedido se guardó hace menos de 24 horas
        if (pedido && Date.now() - pedido.fecha < 24 * 60 * 60 * 1000) {
            const mensaje =
                `¡Hola! Acabo de pagar por Mercado Pago:\n` +
                `• ${pedido.producto}\n` +
                `• Color: ${pedido.color}\n` +
                `• Entrega: ${pedido.entrega}\n` +
                `• Total: ${pedido.precio}`;

            document.getElementById('btn-whatsapp-pedido').href =
                `https://wa.me/59892980915?text=${encodeURIComponent(mensaje)}`;
        }
    } catch (err) {
        // si algo falla, queda el mensaje genérico
    }
</script>

</body>
</html>
