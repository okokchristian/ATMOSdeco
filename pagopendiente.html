<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago pendiente — ATMOS deco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/categorias.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="bg-fixed"></div>

    <section class="estado-pago">
        <div class="estado-pago-content">
            <div class="estado-icono estado-icono-pendiente">
                <i class="bi bi-hourglass-split"></i>
            </div>
                        <h1>Tu pago está pendiente</h1>
            <p>Mercado Pago todavía está procesando tu pago. <strong>Envianos tu pedido por WhatsApp</strong> para que lo tengamos registrado: empezamos a fabricar tu lámpara apenas se acredite el pago.</p>
            <div class="estado-pago-botones">
                <a href="https://wa.me/59892980915?text=Hola!%20Mi%20pago%20por%20Mercado%20Pago%20qued%C3%B3%20pendiente" target="_blank" class="btn-comprar btn-whatsapp" id="btn-whatsapp-pedido">
                    <i class="bi bi-whatsapp"></i> Enviar mi pedido por WhatsApp
                </a>
                <a href="index.html" class="btn-verproductos-outline">Volver al inicio</a>
            </div>
        </div>
    </section>

    <script>
    try {
        const params = new URLSearchParams(window.location.search);
        const idPago = params.get('payment_id');
        const pedido = JSON.parse(localStorage.getItem('atmosPedido'));

        let mensaje = '¡Hola! Hice un pago por Mercado Pago que quedó pendiente:';

        if (pedido && Date.now() - pedido.fecha < 24 * 60 * 60 * 1000) {
            mensaje +=
                `\n• ${pedido.producto}` +
                `\n• Color: ${pedido.color}` +
                `\n• Entrega: ${pedido.entrega}` +
                `\n• Total: ${pedido.precio}`;
        }

        if (idPago) {
            mensaje += `\n• N.º de operación: ${idPago}`;
        }

        document.getElementById('btn-whatsapp-pedido').href =
            `https://wa.me/59892980915?text=${encodeURIComponent(mensaje)}`;
    } catch (err) {
        // si algo falla, queda el mensaje genérico
    }
</script>

</body>
</html>
